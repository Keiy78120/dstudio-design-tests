<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>D-Studio · PricingCard Test #01</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='28'%3E🎨%3C/text%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.0/babel.min.js"></script>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-neutral-950">
  <header class="border-b border-neutral-800 bg-neutral-950 px-6 py-3 text-xs text-neutral-400 flex items-center justify-between">
    <span>D-Studio · Design Tests · Test 01 — PricingCard premium</span>
    <span>Generated by DESIGNER agent · audit ABSENT slop ✓ · <a href="https://github.com/Keiy78120/dstudio-design-tests" class="underline hover:text-white">repo</a></span>
  </header>

  <div id="root"></div>

  <script type="text/babel" data-presets="react,typescript">
    const { useState } = React;

    // Inline Check icon (replaces lucide-react import for CDN context)
    function Check({ className = "", strokeWidth = 2 }) {
      return (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth={strokeWidth}
          strokeLinecap="round"
          strokeLinejoin="round"
          className={className}
          aria-hidden="true"
        >
          <path d="M20 6 9 17l-5-5" />
        </svg>
      );
    }

    interface PricingTier {
      name: string;
      price: number;
      period: string;
      description: string;
      features: string[];
      cta: string;
      highlighted: boolean;
    }

    const TIERS: PricingTier[] = [
      {
        name: "Starter",
        price: 49,
        period: "mois",
        description: "Pour démarrer votre présence digitale",
        features: [
          "1 projet actif",
          "Design system de base",
          "Export Figma inclus",
          "Support email",
          "Mises à jour mensuelles",
        ],
        cta: "Commencer avec Starter",
        highlighted: false,
      },
      {
        name: "Pro",
        price: 149,
        period: "mois",
        description: "Pour les équipes qui veulent aller plus loin",
        features: [
          "5 projets actifs",
          "Design system complet D-Studio",
          "Composants premium illimités",
          "Support prioritaire 24h",
          "Accès bêta aux nouvelles features",
        ],
        cta: "Commencer avec Pro",
        highlighted: true,
      },
      {
        name: "Studio",
        price: 399,
        period: "mois",
        description: "Pour les agences et grandes équipes",
        features: [
          "Projets illimités",
          "White-label complet",
          "Intégrations sur mesure",
          "Account manager dédié",
          "SLA 99.9% garanti",
        ],
        cta: "Contacter l'équipe Studio",
        highlighted: false,
      },
    ];

    /* ─── gradient-border via mask-composite ─── */
    const gradientBorderStyle: React.CSSProperties = { position: "relative" };

    function GradientBorderWrapper({
      children,
      highlighted,
      className = "",
    }: {
      children: React.ReactNode;
      highlighted: boolean;
      className?: string;
    }) {
      return (
        <div className={`relative rounded-2xl ${className}`} style={gradientBorderStyle}>
          <span
            aria-hidden="true"
            className="pointer-events-none absolute inset-0 rounded-2xl"
            style={{
              padding: highlighted ? "1.5px" : "1px",
              background: highlighted
                ? "linear-gradient(135deg, #a855f7 0%, #ec4899 100%)"
                : "linear-gradient(135deg, rgba(168,85,247,0.35) 0%, rgba(236,72,153,0.35) 100%)",
              WebkitMask:
                "linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0)",
              WebkitMaskComposite: "xor",
              maskComposite: "exclude",
            }}
          />
          {children}
        </div>
      );
    }

    function PricingCard({ tier }: { tier: PricingTier }) {
      return (
        <GradientBorderWrapper highlighted={tier.highlighted} className="h-full">
          <article
            className={`relative flex h-full flex-col gap-6 rounded-2xl p-7 ${
              tier.highlighted ? "bg-neutral-900" : "bg-neutral-950"
            }`}
          >
            {tier.highlighted && (
              <div
                aria-label="Plan recommandé"
                className="absolute -top-3.5 left-1/2 -translate-x-1/2 whitespace-nowrap rounded-full px-4 py-1 text-xs font-semibold tracking-wide text-white"
                style={{ background: "linear-gradient(90deg, #a855f7 0%, #ec4899 100%)" }}
              >
                Most Popular
              </div>
            )}

            <header className="space-y-1">
              <h3 className="text-lg font-semibold text-white">{tier.name}</h3>
              <p className="text-sm leading-snug text-neutral-400">{tier.description}</p>
            </header>

            <div className="flex items-end gap-1" aria-label={`${tier.price} euros par ${tier.period}`}>
              <span className="text-5xl font-bold tracking-tight text-white" aria-hidden="true">
                {tier.price}€
              </span>
              <span className="mb-1.5 text-sm text-neutral-400" aria-hidden="true">
                /{tier.period}
              </span>
            </div>

            <div
              aria-hidden="true"
              className="h-px w-full"
              style={{
                background:
                  "linear-gradient(90deg, rgba(168,85,247,0.4) 0%, rgba(236,72,153,0.4) 100%)",
              }}
            />

            <ul className="flex flex-col gap-3" aria-label={`Fonctionnalités du plan ${tier.name}`}>
              {tier.features.map((feature) => (
                <li key={feature} className="flex items-start gap-3">
                  <span
                    aria-hidden="true"
                    className="mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-full"
                    style={{ background: "linear-gradient(135deg, #a855f7 0%, #ec4899 100%)" }}
                  >
                    <Check className="h-3 w-3 text-white" strokeWidth={3} />
                  </span>
                  <span className="text-sm leading-snug text-neutral-200">{feature}</span>
                </li>
              ))}
            </ul>

            <div className="flex-1" />

            <button
              type="button"
              aria-label={`${tier.cta} — plan ${tier.name} à ${tier.price}€ par ${tier.period}`}
              className={`relative w-full overflow-hidden rounded-xl py-3 text-sm font-semibold text-white transition-opacity duration-200 hover:opacity-90 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-purple-500 active:scale-[0.98] ${
                tier.highlighted ? "" : "bg-neutral-800"
              }`}
              style={
                tier.highlighted
                  ? { background: "linear-gradient(90deg, #a855f7 0%, #ec4899 100%)" }
                  : undefined
              }
            >
              {tier.cta}
              {!tier.highlighted && (
                <span
                  aria-hidden="true"
                  className="pointer-events-none absolute inset-0 rounded-xl"
                  style={{
                    padding: "1px",
                    background:
                      "linear-gradient(135deg, rgba(168,85,247,0.5) 0%, rgba(236,72,153,0.5) 100%)",
                    WebkitMask:
                      "linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0)",
                    WebkitMaskComposite: "xor",
                    maskComposite: "exclude",
                  }}
                />
              )}
            </button>
          </article>
        </GradientBorderWrapper>
      );
    }

    function PricingCards() {
      return (
        <section
          aria-labelledby="pricing-heading"
          className="min-h-svh w-full bg-neutral-950 px-4 py-20"
        >
          <div className="mx-auto max-w-5xl">
            <header className="mb-14 text-center">
              <h2 id="pricing-heading" className="mb-3 text-4xl font-bold text-white">
                Tarifs D-Studio
              </h2>
              <p className="text-base text-neutral-300">
                Des plans adaptés à chaque étape de votre croissance
              </p>
            </header>

            <div
              className="grid gap-6"
              style={{
                gridTemplateColumns: "repeat(auto-fit, minmax(min(100%, 18rem), 1fr))",
              }}
            >
              {TIERS.map((tier) => (
                <PricingCard key={tier.name} tier={tier} />
              ))}
            </div>

            <p className="mt-10 text-center text-xs text-neutral-500">
              Tous les prix sont HT · Facturation mensuelle · Résiliation à tout moment
            </p>
          </div>
        </section>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<PricingCards />);
  </script>
</body>
</html>
